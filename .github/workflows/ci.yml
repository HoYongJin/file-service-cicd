#
# 이름 : ci.yml
# 용도 : push와 PR마다 테스트를 자동 실행함
# 대상 : main 브랜치

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          chmod +x gradlew
          ./gradlew test

    # TODO [1-6] 테스트가 실패했을 때만 테스트 보고서를 아티팩트로 올립니다.
    #            보고서 경로는 build/reports/tests/test 이고, 보관 기간은 7일입니다.